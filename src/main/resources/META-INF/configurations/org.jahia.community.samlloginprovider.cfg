# default configuration - won't be overridden
#
# saml-login-provider module: this file is copied to karaf/etc only if absent;
# your changes (manual or via the Jahia Authentication administration card)
# are kept across module redeployments.

# Comma-separated list of virtual hosts (FQDNs) on which unauthenticated
# visitors are redirected to the SAML connect endpoint (/home.connect.saml)
# instead of the Jahia login page, and on which the logout button lands on a
# public page.
#
# Fail-safe default: when this property is empty or absent, the module is
# INACTIVE on every host (standard /cms/login page and default logout).
# Each listed host must be served by a site where the saml-authentication-valve
# connector is enabled and configured, otherwise users on that host reach a
# /home.connect.saml endpoint answering 400 with no login fallback.
#
# Example:
# fqdn=edit.jahia.com,editpp.jahia.com
fqdn=
