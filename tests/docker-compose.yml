services:
    jahia:
        image: '${JAHIA_IMAGE}'
        container_name: jahia
        # Bound to loopback only: 8000 is an unauthenticated JDWP debug port (JPDA=true) and the
        # root password is a well-known test default, so neither may be reachable from the LAN.
        # Cypress reaches Jahia over the 'stack' network (http://jahia:8080), unaffected by this.
        ports:
            - '127.0.0.1:8080:8080'
            - '127.0.0.1:8000:8000'
        environment:
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_LICENSE=${JAHIA_LICENSE}
            - JPDA=true
        extra_hosts:
            - jahia:127.0.0.1
        networks:
            - stack
    # Cypress container
    cypress:
        image: '${TESTS_IMAGE}'
        # https://github.com/cypress-io/cypress/issues/350
        ipc: host
        container_name: cypress
        depends_on:
            - jahia
        environment:
            - MANIFEST=${MANIFEST}
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_URL=http://jahia:8080
            - NEXUS_USERNAME=${NEXUS_USERNAME}
            - NEXUS_PASSWORD=${NEXUS_PASSWORD}
        networks:
            - stack
networks:
    stack:
